<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 360" font-family="'SF Mono','Menlo','Consolas',monospace">
  <defs>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#565f89"/>
    </marker>
    <marker id="ar2y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e0af68"/>
    </marker>
  </defs>
  <rect width="1040" height="360" rx="12" fill="#1a1b26"/>
  <text x="520" y="40" text-anchor="middle" fill="#c0caf5" font-size="17" font-weight="bold">3층 노트북 - 프로젝트별 장기기억</text>

  <!-- 일반화 축 -->
  <line x1="44" y1="80" x2="44" y2="300" stroke="#565f89" stroke-width="1.5" marker-end="url(#ar2)"/>
  <text x="30" y="190" fill="#565f89" font-size="12" transform="rotate(-90 30 190)" text-anchor="middle">특수 → 일반</text>

  <!-- 층 박스 -->
  <g font-size="14">
    <rect x="70" y="76" width="430" height="64" rx="8" fill="#24283b" stroke="#bb9af7"/>
    <text x="88" y="102" fill="#bb9af7" font-weight="bold">projects/&lt;슬러그&gt;/</text>
    <text x="88" y="126" fill="#565f89" font-size="13">프로젝트 고유 - 구조, 진입점, 컨벤션 위치</text>

    <rect x="70" y="156" width="430" height="64" rx="8" fill="#24283b" stroke="#7aa2f7"/>
    <text x="88" y="182" fill="#7aa2f7" font-weight="bold">stacks/&lt;스택&gt;/</text>
    <text x="88" y="206" fill="#565f89" font-size="13">엔진/프레임워크 일반 - 버전 태그 필수</text>

    <rect x="70" y="236" width="430" height="64" rx="8" fill="#24283b" stroke="#9ece6a"/>
    <text x="88" y="262" fill="#9ece6a" font-weight="bold">common/</text>
    <text x="88" y="286" fill="#565f89" font-size="13">스택 무관 - 도구 함정, 일반 원칙</text>
  </g>

  <!-- 우측 접근 경로 -->
  <g font-size="14">
    <rect x="640" y="76" width="360" height="64" rx="8" fill="#1f2335" stroke="#3b4261"/>
    <text x="658" y="102" fill="#c0caf5" font-weight="bold">nb-load.sh</text>
    <text x="658" y="126" fill="#565f89" font-size="13">발동 시 3층 인덱스 1방 로딩 (읽기)</text>

    <rect x="640" y="156" width="360" height="64" rx="8" fill="#1f2335" stroke="#3b4261"/>
    <text x="658" y="182" fill="#c0caf5" font-weight="bold">nb-grep.sh</text>
    <text x="658" y="206" fill="#565f89" font-size="13">파일을 손대기 전 함정 대조 (읽기)</text>

    <rect x="640" y="236" width="360" height="64" rx="8" fill="#1f2335" stroke="#e0af68"/>
    <text x="658" y="262" fill="#e0af68" font-weight="bold">curator 서브에이전트</text>
    <text x="658" y="286" fill="#565f89" font-size="13">P5 기록/정비 - 유일한 쓰기 창구</text>
  </g>

  <!-- 연결 화살표 -->
  <line x1="636" y1="108" x2="504" y2="108" stroke="#565f89" stroke-width="1.5" marker-end="url(#ar2)"/>
  <line x1="636" y1="188" x2="504" y2="188" stroke="#565f89" stroke-width="1.5" marker-end="url(#ar2)"/>
  <line x1="640" y1="268" x2="504" y2="268" stroke="#e0af68" stroke-width="1.5" marker-end="url(#ar2y)"/>

  <text x="520" y="338" text-anchor="middle" fill="#565f89" font-size="13">층은 "이 사실이 어디까지 일반화되는가"로 가른다 - 전량 로드 없이 얇은 인덱스만 읽는다</text>
</svg>
